<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Icon gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#0F172A" />

  <!-- Brain hemisphere - left -->
  <path d="M9 16 C9 11, 13 9, 15 9 C17 9, 18 11, 18 12"
        fill="none" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Brain hemisphere - right -->
  <path d="M18 12 C18 11, 19 9, 21 9 C23 9, 27 11, 27 16"
        fill="none" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Brain bottom curve -->
  <path d="M9 16 C9 21, 13 23, 16 23 C19 23, 21 21, 23 19"
        fill="none" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" />
  <path d="M23 19 C25 21, 27 23, 29 23"
        fill="none" stroke="url(#iconGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Neural network nodes -->
  <circle cx="11" cy="14" r="1.5" fill="#818CF8" filter="url(#glow)" />
  <circle cx="15" cy="12" r="1.2" fill="#A78BFA" filter="url(#glow)" />
  <circle cx="13" cy="19" r="1.2" fill="#818CF8" filter="url(#glow)" />
  <circle cx="19" cy="16" r="1.8" fill="#C084FC" filter="url(#glow)" />
  <circle cx="17" cy="13" r="1" fill="#A78BFA" filter="url(#glow)" />
  <circle cx="21" cy="13" r="1" fill="#A78BFA" filter="url(#glow)" />
  <circle cx="24" cy="14" r="1.2" fill="#A78BFA" filter="url(#glow)" />
  <circle cx="25" cy="18" r="1.5" fill="#818CF8" filter="url(#glow)" />

  <!-- Neural connections -->
  <line x1="11" y1="14" x2="15" y2="12" stroke="#A78BFA" stroke-width="0.8" opacity="0.5" />
  <line x1="11" y1="14" x2="13" y2="19" stroke="#A78BFA" stroke-width="0.8" opacity="0.5" />
  <line x1="15" y1="12" x2="17" y2="13" stroke="#A78BFA" stroke-width="0.8" opacity="0.5" />
  <line x1="15" y1="12" x2="19" y2="16" stroke="#C084FC" stroke-width="0.8" opacity="0.5" />
  <line x1="17" y1="13" x2="19" y2="16" stroke="#C084FC" stroke-width="0.8" opacity="0.5" />
  <line x1="21" y1="13" x2="19" y2="16" stroke="#C084FC" stroke-width="0.8" opacity="0.5" />
  <line x1="21" y1="13" x2="24" y2="14" stroke="#A78BFA" stroke-width="0.8" opacity="0.5" />
  <line x1="19" y1="16" x2="24" y2="14" stroke="#A78BFA" stroke-width="0.8" opacity="0.5" />
  <line x1="19" y1="16" x2="25" y2="18" stroke="#A78BFA" stroke-width="0.8" opacity="0.5" />
  <line x1="24" y1="14" x2="25" y2="18" stroke="#A78BFA" stroke-width="0.8" opacity="0.5" />
  <line x1="13" y1="19" x2="19" y2="16" stroke="#A78BFA" stroke-width="0.8" opacity="0.5" />
  <line x1="19" y1="16" x2="22" y2="20" stroke="#C084FC" stroke-width="0.8" opacity="0.5" />
</svg>
