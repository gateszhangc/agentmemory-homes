<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <!-- Background gradient for the icon -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Soft shadow for icon -->
    <filter id="iconShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#8B5CF6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- === ICON: Stylized brain/neural network + memory chip === -->

  <!-- Outer brain/circuit shape -->
  <g filter="url(#iconShadow)">
    <!-- Main brain hemisphere - left -->
    <path d="M22 50 C22 28, 38 22, 48 22 C58 22, 62 28, 64 34"
          fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Main brain hemisphere - right -->
    <path d="M64 34 C66 28, 70 22, 80 22 C90 22, 106 28, 106 50"
          fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Top connecting bridge -->
    <path d="M58 28 C60 20, 68 20, 70 28"
          fill="none" stroke="url(#iconGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Brain bottom curve -->
    <path d="M22 50 C22 72, 38 78, 50 78 C62 78, 70 74, 76 68"
          fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" />
    <path d="M76 68 C82 74, 90 78, 106 78 C112 78, 118 72, 118 60"
          fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Inner fold lines (sulci) - left hemisphere -->
    <path d="M38 38 C42 42, 40 50, 44 54"
          fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <path d="M46 44 C50 48, 48 56, 52 60"
          fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

    <!-- Inner fold lines - right hemisphere -->
    <path d="M80 38 C84 34, 86 42, 90 46"
          fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />
    <path d="M78 52 C82 48, 84 56, 88 60"
          fill="none" stroke="url(#iconGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7" />

    <!-- Neural network nodes and connections -->
    <!-- Left cluster -->
    <circle cx="30" cy="42" r="3.5" fill="#818CF8" filter="url(#glow)" />
    <circle cx="42" cy="36" r="3" fill="#A78BFA" filter="url(#glow)" />
    <circle cx="36" cy="58" r="3" fill="#818CF8" filter="url(#glow)" />

    <!-- Center cluster -->
    <circle cx="64" cy="50" r="4" fill="#C084FC" filter="url(#glow)" />
    <circle cx="56" cy="40" r="2.5" fill="#A78BFA" filter="url(#glow)" />
    <circle cx="72" cy="40" r="2.5" fill="#A78BFA" filter="url(#glow)" />

    <!-- Right cluster -->
    <circle cx="92" cy="42" r="3" fill="#A78BFA" filter="url(#glow)" />
    <circle cx="98" cy="54" r="3.5" fill="#818CF8" filter="url(#glow)" />

    <!-- Neural connections -->
    <line x1="30" y1="42" x2="42" y2="36" stroke="#A78BFA" stroke-width="1.5" opacity="0.5" />
    <line x1="30" y1="42" x2="36" y2="58" stroke="#A78BFA" stroke-width="1.5" opacity="0.5" />
    <line x1="42" y1="36" x2="56" y2="40" stroke="#A78BFA" stroke-width="1.5" opacity="0.5" />
    <line x1="42" y1="36" x2="64" y2="50" stroke="#C084FC" stroke-width="1.5" opacity="0.5" />
    <line x1="56" y1="40" x2="64" y2="50" stroke="#C084FC" stroke-width="1.5" opacity="0.5" />
    <line x1="72" y1="40" x2="64" y2="50" stroke="#C084FC" stroke-width="1.5" opacity="0.5" />
    <line x1="72" y1="40" x2="92" y2="42" stroke="#A78BFA" stroke-width="1.5" opacity="0.5" />
    <line x1="64" y1="50" x2="92" y2="42" stroke="#A78BFA" stroke-width="1.5" opacity="0.5" />
    <line x1="64" y1="50" x2="98" y2="54" stroke="#A78BFA" stroke-width="1.5" opacity="0.5" />
    <line x1="92" y1="42" x2="98" y2="54" stroke="#A78BFA" stroke-width="1.5" opacity="0.5" />
    <line x1="36" y1="58" x2="64" y2="50" stroke="#A78BFA" stroke-width="1.5" opacity="0.5" />
    <line x1="64" y1="50" x2="78" y2="60" stroke="#C084FC" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- === TEXT: "agentmemory" === -->
  <g transform="translate(130, 0)">
    <!-- "agent" - lighter, thinner -->
    <text x="0" y="58" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace"
          font-size="32" font-weight="300" fill="#94A3B8" letter-spacing="1">
      agent
    </text>

    <!-- "memory" - bolder, gradient -->
    <text x="0" y="58" font-family="'SF Mono', 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace"
          font-size="32" font-weight="700" fill="url(#iconGrad)" letter-spacing="1">
      <tspan x="80" dy="0">memory</tspan>
    </text>
  </g>

  <!-- Decorative dot -->
  <circle cx="345" cy="50" r="3" fill="#C084FC" filter="url(#glow)" opacity="0.7" />
</svg>
